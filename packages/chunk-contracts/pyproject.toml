[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "voice-pipeline-chunk-contracts"
version = "0.1.0"
description = "Strict chunk diarization and separation result contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["voice-pipeline-diarization-artifact"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.uv.sources]
voice-pipeline-diarization-artifact = { path = "../diarization-artifact" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "voice_pipeline_chunk_contracts"
module-root = "src"
