[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "voice-pipeline-forced-alignment"
version = "0.1.0"
description = "Qwen3 forced-alignment adapter for generated voice segments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=0.36,<1",
  "qwen-asr>=0.0.6,<0.1",
  "torch>=2.9,<2.10",
  "voice-pipeline-chunk-contracts",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
voice-pipeline-chunk-contracts = { path = "../chunk-contracts" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "voice_pipeline_forced_alignment"
module-root = "src"
