[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "voice-pipeline-models"
version = "0.1.0"
description = "Shared SQLAlchemy models for the Voice Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "voice_pipeline_models"
module-root = "src"
