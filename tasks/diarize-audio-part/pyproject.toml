[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "voice-pipeline-diarize-audio-part"
version = "0.1.0"
description = "Celery worker for deterministic audio-part speaker diarization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "diarizen @ git+https://github.com/BUTSpeechFIT/DiariZen.git@844f5555b0a98acd0931511fc641a8c5b8ba92c7",
  "huggingface-hub>=0.29,<1",
  "numpy>=1.26,<2",
  "accelerate>=1.6,<2",
  "asteroid-filterbanks>=0.4,<1",
  "einops>=0.6,<1",
  "librosa>=0.10,<1",
  "omegaconf>=2.1,<3",
  "psutil>=6,<8",
  "pyannote-audio @ git+https://github.com/BUTSpeechFIT/DiariZen.git@844f5555b0a98acd0931511fc641a8c5b8ba92c7#subdirectory=pyannote-audio",
  "pyannote-core==5.0.0",
  "pyannote-database==5.1.3",
  "pyannote-metrics==3.2.1",
  "pyannote-pipeline==3.0.1",
  "pytorch-metric-learning>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "soundfile>=0.13,<1",
  "sqlalchemy>=2.0,<3",
  "speechbrain>=0.5.14,<2",
  "tensorboardX>=2.6,<3",
  "toml>=0.10,<1",
  "torch-audiomentations>=0.11,<1",
  "torchmetrics>=0.11,<2",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "voice-pipeline-models",
  "voice-pipeline-diarization-artifact",
  "voice-pipeline-task-client",
  "voice-pipeline-task-contracts",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[project.scripts]
diarize-audio-part-worker = "voice_pipeline_diarize_audio_part.worker:main"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
voice-pipeline-models = { path = "../../packages/models" }
voice-pipeline-diarization-artifact = { path = "../../packages/diarization-artifact" }
voice-pipeline-task-client = { path = "../../packages/task-client" }
voice-pipeline-task-contracts = { path = "../../packages/task-contracts" }
torch = [{ index = "pytorch-cu126", marker = "platform_machine == 'aarch64'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "platform_machine == 'aarch64'" }]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL, Redis, and S3-compatible services",
  "model_smoke: downloads and runs the configured real model",
  "capacity: runs the configured model against a 900-second WAV",
]

[tool.uv.build-backend]
module-name = "voice_pipeline_diarize_audio_part"
module-root = "src"
