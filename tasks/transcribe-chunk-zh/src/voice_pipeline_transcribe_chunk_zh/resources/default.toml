config_version = "paraformer-zh-v1"

[model]
repo_id = "iic/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch"
revision = "v2.0.4"
device = "auto"

[punctuation]
repo_id = "iic/punc_ct-transformer_cn-en-common-vocab471067-large"
revision = "v2.0.4"
max_chars = 256

[slices]
merge_gap_ms = 2000
pad_ms = 500

[utterance]
huge_gap_ms = 2000
clause_min_ms = 2000
medium_min_ms = 10000
medium_gap_ms = 600
emergency_min_ms = 20000
emergency_gap_ms = 80
character_max_duration_ms = 2000
character_capped_duration_ms = 300

[task]
workspace_prefix = "voice-pipeline-transcribe-chunk-zh-"
error_max_length = 512
